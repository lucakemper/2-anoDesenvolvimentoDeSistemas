<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <form action="#">
        <h1>FORMULÁRIO ABSURDO</h1>
           <!-- INPUT NOME -->
        <div class="formAssunto">
            <label for="nome">Nome:</label>
            <input id="nome" type="text" placeholder="Exemplo: João">
        </div>
         <!-- INPUT EMAIL -->
         <div class="formAssunto">
            <label for="email">Email:</label>
            <input id="email" type="email" placeholder="Exemplo: joao@email.com">
        </div>
         <!-- INPUT COR -->
         <div class="forAssunto">
            <label for="cor">Cor :</label>
            <input id="cor" type="color">
         </div> 
        <!-- INPUT IDADE -->
         <div class="formAssunto">
            <label for="idade">Idade:</label>
            <input id="idade" type="number" min="0" max="150"  step="1">
        </div>
        <!-- SELECT ESTADO -->
         <select name="estado" id="estado">
            <option value="">Selecione um estado</option>
            <option value="sp">São Paulo</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="mg">Minas Gerais</option>
        </select>
        <!-- FEEDBACK -->
        <div class="formAssunto">
        <textarea style="resize: none;" name="feedback" id="feedback"
         cols="30" rows="10">
        </textarea>
        </div> 
        <!-- ENVIAR -->
         <!--input type="button" value="ENVIAR"  -->
         <button type="submit">ENVIAR</button>
         <button type="reset">RESETAR</button>
         <button id="bemvindo" type="button">BEM VINDO</button>

    </form>

</body>
<script>
    document.getElementById("bemvindo").addEventListener("click", () => {
        nome = document.getElementById("nome").value
        alert("Seja bem vindo(a)"+nome)
    })
</script>

</html>
